# Replace "mower" with your entity name prefix.
type: vertical-stack
cards:
  - type: tile
    entity: lawn_mower.mower
    features:
      - type: lawn-mower-commands
        commands: [start_pause, dock]
  - type: entities
    entities:
      - sensor.mower_state
      - sensor.mower_battery
      - binary_sensor.mower_charging
      - sensor.mower_error
      - sensor.mower_last_cut
      - sensor.mower_total_work_time
      - binary_sensor.mower_connected
  - type: horizontal-stack
    cards:
      - {type: button, entity: button.mower_start_mowing, name: Mow, icon: mdi:play}
      - {type: button, entity: button.mower_mow_once, name: Mow once, icon: mdi:play-circle}
      - {type: button, entity: button.mower_edge_cut, name: Edge, icon: mdi:vector-square}
      - {type: button, entity: button.mower_spiral_cut, name: Spiral, icon: mdi:rotate-360}
      - {type: button, entity: button.mower_stop, name: Stop, icon: mdi:stop}
      - {type: button, entity: button.mower_return_to_dock, name: Dock, icon: mdi:home}
  - type: entities
    title: Settings
    entities:
      - switch.mower_boundary_trimming
      - switch.mower_ultrasonic_sensor
      - number.mower_ultrasonic_distance
      - switch.mower_rain_sensor
      - number.mower_rain_delay
      - select.mower_boundary_signal
      - switch.mower_mowing_time_mode
