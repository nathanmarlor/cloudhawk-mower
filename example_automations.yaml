# Replace "mower" with your entity name prefix; get the device_id from the device page URL.

- alias: Mow weekday mornings
  trigger: {platform: time, at: "09:00:00"}
  condition:
    - {condition: time, weekday: [mon, tue, wed, thu, fri]}
    - {condition: state, entity_id: lawn_mower.mower, state: docked}
    - {condition: numeric_state, entity_id: sensor.mower_battery, above: 80}
  action: {action: lawn_mower.start_mowing, target: {entity_id: lawn_mower.mower}}

- alias: Dock when rain is forecast
  trigger: {platform: state, entity_id: weather.home, to: rainy}
  condition: {condition: state, entity_id: lawn_mower.mower, state: mowing}
  action: {action: lawn_mower.dock, target: {entity_id: lawn_mower.mower}}

- alias: Mower needs help
  trigger: {platform: state, entity_id: binary_sensor.mower_problem, to: "on", for: "00:02:00"}
  action:
    action: notify.mobile_app_phone
    data:
      title: Mower
      message: "{{ states('sensor.mower_state') }} ({{ states('sensor.mower_error') }})"

- alias: Mower lid opened
  trigger: {platform: state, entity_id: binary_sensor.mower_cover, to: "on"}
  action: {action: notify.mobile_app_phone, data: {message: Mower cover opened}}

- alias: Mower lost Bluetooth for 10 minutes
  trigger: {platform: state, entity_id: binary_sensor.mower_connected, to: "off", for: "00:10:00"}
  action: {action: notify.mobile_app_phone, data: {message: Mower unreachable over Bluetooth}}

- alias: Keep the mower clock in sync
  trigger: {platform: time, at: "03:00:00"}
  action: {action: button.press, target: {entity_id: button.mower_sync_clock}}

- alias: Summer schedule
  trigger: {platform: time, at: "00:05:00"}
  condition: {condition: template, value_template: "{{ now().month in [5, 6, 7, 8] and now().day == 1 }}"}
  action:
    - action: cloudhawk.set_cut_days
      data: {device_id: YOUR_DEVICE_ID, days: [monday, wednesday, friday]}
    - action: cloudhawk.set_schedule
      data:
        device_id: YOUR_DEVICE_ID
        monday: [{start: "09:00", end: "12:00"}]
        wednesday: [{start: "09:00", end: "12:00"}]
        friday: [{start: "09:00", end: "12:00"}, {start: "15:00", end: "17:00"}]
