set_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cloudhawk
    monday: &day
      required: false
      example: '[{"start": "09:00", "end": "12:00"}, {"start": "15:00", "end": "18:00"}]'
      selector:
        object:
    tuesday: *day
    wednesday: *day
    thursday: *day
    friday: *day
    saturday: *day
    sunday: *day

set_cut_days:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cloudhawk
    days:
      required: true
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

set_pin:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: cloudhawk
    pin:
      required: true
      selector:
        text:
